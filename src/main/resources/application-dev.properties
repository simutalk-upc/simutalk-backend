# Perfil de desarrollo. Se activa con SPRING_PROFILES_ACTIVE=dev.
# Solo sobrescribe lo que cambia frente a application.properties.

# Ver el SQL que emite Hibernate mientras se desarrolla.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Trazas de la aplicacion y de las consultas.
logging.level.pe.upc.simutalk=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Servicios externos sin red: ningun desarrollador necesita llaves de API para levantar la app.
external.ai.mode=mock
external.credentials.mode=mock
mail.mode=mock

# Datos de demostracion para tener con que probar.
app.seed-demo-data=true
