# Datos de demostración (1 empresa, 6 candidatos). Solo se crean si la base de perfiles está vacía.
app.seed-demo-data=${SEED_DEMO_DATA:false}
# Contraseña de los usuarios demo. Si falta, se usa una aleatoria y no podrán iniciar sesión.
app.demo-users-password=${DEMO_USERS_PASSWORD:}
# Clave HMAC de los códigos CANDIDATO-X-9999. Si no se define, se deriva de JWT_SECRET.
app.anonymization.secret=${ANONYMIZATION_SECRET:${authorization.jwt.secret}}

server.port=${SERVER_PORT:8080}
spring.web.error.include-message=always

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
