spring.application.name=simutalk
# Carga opcional de un archivo .env en la raíz (formato KEY=VALUE). Nunca se versiona.
spring.config.import=optional:file:.env[.properties]

# Por defecto jdbc:postgresql://localhost:5432/simutalk_db. La base debe existir (PostgreSQL no la crea sola).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/simutalk_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=pe.upc.simutalk.config.SnakeCasePluralizedNamingStrategy
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.time-zone=UTC
# Boot 4 usa Jackson 3; esto conserva los valores por defecto de la era Jackson 2 (p. ej. un boolean primitivo
# ausente en el cuerpo no rompe la deserialización y la validación responde por campo, como antes).
spring.jackson.use-jackson2-defaults=true

# Base64 de al menos 256 bits. Sin valor por defecto: la app no arranca sin JWT_SECRET.
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration-days=${JWT_EXPIRATION_DAYS:7}
# Opcional. Si ambos están definidos, se crea este administrador al arrancar (si no existe).
authorization.bootstrap-admin.username=${ADMIN_USERNAME:}
authorization.bootstrap-admin.password=${ADMIN_PASSWORD:}

# mock (por defecto, sin red) | live (llama al emisor; aún sin emisores conectados)
external.credentials.mode=${CREDENTIALS_MODE:mock}
external.credentials.timeout=5s
external.credentials.max-retries=3
external.credentials.initial-backoff=500ms

# mock (por defecto, sin red, determinista) | live (Google Gemini)
external.ai.mode=${AI_MODE:mock}
external.ai.timeout=20s
external.ai.max-retries=3
external.ai.initial-backoff=1s
# Resultados en memoria por hash del texto + criterio (solo en modo live)
external.ai.cache-size=500
external.ai.gemini.base-url=https://generativelanguage.googleapis.com
external.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
# Obligatoria en modo live. Nunca se escribe aquí.
external.ai.gemini.api-key=${GEMINI_API_KEY:}

# Correos al candidato (invitación a entrevista, terna final, descarte). mock (por defecto): solo se registra en
# el log lo que se habría enviado | live: Brevo (requiere BREVO_API_KEY y MAIL_SENDER_EMAIL). Nunca se escriben aquí.
mail.mode=${MAIL_MODE:mock}
mail.timeout=5s
mail.brevo.base-url=https://api.brevo.com
mail.brevo.api-key=${BREVO_API_KEY:}
mail.sender.email=${MAIL_SENDER_EMAIL:}
mail.sender.name=${MAIL_SENDER_NAME:SimuTalk}

# kg CO2e por km recorrido. VALOR DE REFERENCIA: el equipo debe validarlo con una fuente citable
# (p. ej. factores del MINAM o de DEFRA para el medio de transporte típico de Lima) antes de reportarlo.
sustainability.emission-factor-kg-co2e-per-km=${SUSTAINABILITY_EMISSION_FACTOR:0.121}
# Distancia por calles / distancia en línea recta
sustainability.road-factor=1.3
# Distancia de ida cuando un distrito no tiene coordenadas
sustainability.default-one-way-distance-km=12
# Centroides APROXIMADOS de distritos de Lima Metropolitana (latitud, longitud).
