# Perfil de produccion. Se activa con SPRING_PROFILES_ACTIVE=prod.
# Solo sobrescribe lo que cambia frente a application.properties.

# Nada de SQL en los logs del servidor.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.pe.upc.simutalk=INFO
logging.level.org.hibernate.SQL=WARN

# Nunca sembrar datos de demostracion sobre datos reales.
app.seed-demo-data=false

# ddl-auto sigue en update, igual que el despliegue actual en AWS. Cuando el equipo
# incorpore migraciones versionadas, este es el lugar para pasarlo a validate.
