spring:
  application:
    name: simutalk
  config:
    # Carga opcional de un archivo .env en la raíz (formato KEY=VALUE). Nunca se versiona.
    import: optional:file:.env[.properties]

  datasource:
    # Por defecto jdbc:postgresql://localhost:5432/simutalk_db. La base debe existir (PostgreSQL no la crea sola).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/simutalk_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: pe.upc.simutalk.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

authorization:
  jwt:
    # Base64 de al menos 256 bits. Sin valor por defecto: la app no arranca sin JWT_SECRET.
    secret: ${JWT_SECRET}
    expiration-days: ${JWT_EXPIRATION_DAYS:7}
  bootstrap-admin:
    # Opcional. Si ambos están definidos, se crea este administrador al arrancar (si no existe).
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}

external:
  credentials:
    # mock (por defecto, sin red) | live (llama al emisor; aún sin emisores conectados)
    mode: ${CREDENTIALS_MODE:mock}
    timeout: 5s
    max-retries: 3
    initial-backoff: 500ms
  ai:
    # mock (por defecto, sin red, determinista) | live (Google Gemini)
    mode: ${AI_MODE:mock}
    timeout: 20s
    max-retries: 3
    initial-backoff: 1s
    # Resultados en memoria por hash del texto + criterio (solo en modo live)
    cache-size: 500
    gemini:
      base-url: https://generativelanguage.googleapis.com
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      # Obligatoria en modo live. Nunca se escribe aquí.
      api-key: ${GEMINI_API_KEY:}

app:
  # Datos de demostración (1 empresa, 6 candidatos). Solo se crean si la base de perfiles está vacía.
  seed-demo-data: ${SEED_DEMO_DATA:false}
  # Contraseña de los usuarios demo. Si falta, se usa una aleatoria y no podrán iniciar sesión.
  demo-users-password: ${DEMO_USERS_PASSWORD:}
  anonymization:
    # Clave HMAC de los códigos CANDIDATO-X-9999. Si no se define, se deriva de JWT_SECRET.
    secret: ${ANONYMIZATION_SECRET:${authorization.jwt.secret}}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
