spring:
  application:
    name: simutalk
  autoconfigure:
    # Evita el usuario en memoria con contraseña generada. El contexto iam aportará su propio UserDetailsService.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  config:
    # Carga opcional de un archivo .env en la raíz (formato KEY=VALUE). Nunca se versiona.
    import: optional:file:.env[.properties]

  datasource:
    # Por defecto jdbc:postgresql://localhost:5432/simutalk_db. La base debe existir (PostgreSQL no la crea sola).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/simutalk_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
