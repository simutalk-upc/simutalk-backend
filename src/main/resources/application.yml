spring:
  application:
    name: simutalk
  config:
    # Carga opcional de un archivo .env en la raíz (formato KEY=VALUE). Nunca se versiona.
    import: optional:file:.env[.properties]

  datasource:
    # Por defecto jdbc:postgresql://localhost:5432/simutalk_db. La base debe existir (PostgreSQL no la crea sola).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/simutalk_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: pe.upc.simutalk.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

authorization:
  jwt:
    # Base64 de al menos 256 bits. Sin valor por defecto: la app no arranca sin JWT_SECRET.
    secret: ${JWT_SECRET}
    expiration-days: ${JWT_EXPIRATION_DAYS:7}
  bootstrap-admin:
    # Opcional. Si ambos están definidos, se crea este administrador al arrancar (si no existe).
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}

external:
  credentials:
    # mock (por defecto, sin red) | live (llama al emisor; aún sin emisores conectados)
    mode: ${CREDENTIALS_MODE:mock}
    timeout: 5s
    max-retries: 3
    initial-backoff: 500ms
  ai:
    # mock (por defecto, sin red, determinista) | live (Google Gemini)
    mode: ${AI_MODE:mock}
    timeout: 20s
    max-retries: 3
    initial-backoff: 1s
    # Resultados en memoria por hash del texto + criterio (solo en modo live)
    cache-size: 500
    gemini:
      base-url: https://generativelanguage.googleapis.com
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      # Obligatoria en modo live. Nunca se escribe aquí.
      api-key: ${GEMINI_API_KEY:}

sustainability:
  # kg CO2e por km recorrido. VALOR DE REFERENCIA: el equipo debe validarlo con una fuente citable
  # (p. ej. factores del MINAM o de DEFRA para el medio de transporte típico de Lima) antes de reportarlo.
  emission-factor-kg-co2e-per-km: ${SUSTAINABILITY_EMISSION_FACTOR:0.12}
  # Distancia por calles / distancia en línea recta
  road-factor: 1.3
  # Distancia de ida cuando un distrito no tiene coordenadas
  default-one-way-distance-km: 12
  # Centroides APROXIMADOS de distritos de Lima Metropolitana (latitud, longitud)
  districts:
    - { name: "Cercado de Lima", latitude: -12.0464, longitude: -77.0428 }
    - { name: "Lima", latitude: -12.0464, longitude: -77.0428 }
    - { name: "San Isidro", latitude: -12.0970, longitude: -77.0365 }
    - { name: "Miraflores", latitude: -12.1211, longitude: -77.0297 }
    - { name: "Barranco", latitude: -12.1440, longitude: -77.0200 }
    - { name: "Santiago de Surco", latitude: -12.1450, longitude: -76.9900 }
    - { name: "San Borja", latitude: -12.1000, longitude: -77.0000 }
    - { name: "La Molina", latitude: -12.0800, longitude: -76.9400 }
    - { name: "Lince", latitude: -12.0850, longitude: -77.0360 }
    - { name: "Jesús María", latitude: -12.0770, longitude: -77.0480 }
    - { name: "San Miguel", latitude: -12.0770, longitude: -77.0870 }
    - { name: "Comas", latitude: -11.9400, longitude: -77.0600 }
    - { name: "Los Olivos", latitude: -11.9700, longitude: -77.0700 }
    - { name: "San Juan de Lurigancho", latitude: -11.9800, longitude: -77.0000 }
    - { name: "Ate", latitude: -12.0260, longitude: -76.9180 }
    - { name: "Villa El Salvador", latitude: -12.2120, longitude: -76.9400 }

app:
  # Datos de demostración (1 empresa, 6 candidatos). Solo se crean si la base de perfiles está vacía.
  seed-demo-data: ${SEED_DEMO_DATA:false}
  # Contraseña de los usuarios demo. Si falta, se usa una aleatoria y no podrán iniciar sesión.
  demo-users-password: ${DEMO_USERS_PASSWORD:}
  anonymization:
    # Clave HMAC de los códigos CANDIDATO-X-9999. Si no se define, se deriva de JWT_SECRET.
    secret: ${ANONYMIZATION_SECRET:${authorization.jwt.secret}}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
